<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Publicidad Corporativa | RD Gestiones</title>
  <link rel="stylesheet" href="https://cloudflare.com">
</head>
<body style="background-color: #000000; font-family: sans-serif; color: #ffffff; margin: 0; padding: 40px 20px;">

  <!-- Contenedor Principal -->
  <div style="max-width: 1100px; margin: auto; text-align: center;">
    
    <h1 style="color: #d4af37; font-size: 2.5rem; margin-bottom: 10px;">Galería Publicitaria</h1>
    <p style="color: #a0a0a0; font-size: 1.1rem; margin-bottom: 40px;">Conoce más sobre nuestras soluciones y gestiones virtuales en Medellín</p>

    <!-- AQUÍ IRÁS AGREGANDO TUS PRÓXIMOS VIDEOS PUBLICITARIOS -->
    <div style="display: flex; flex-wrap: wrap; gap: 30px; justify-content: center; margin-bottom: 40px;">
      
      <!-- Video publicitario 1 (Ejemplo base con el que ya tienes) -->
      <div style="background: linear-gradient(135deg, #1a1a1a, #111111); border: 1px solid #d4af37; border-radius: 16px; padding: 20px; width: 100%; max-width: 280px; box-shadow: 0 4px 15px rgba(0,0,0,0.5);">
        <video controls style="width: 100%; height: auto; border-radius: 10px; margin-bottom: 15px;">
          <source src="promo.mp4.mp4" type="video/mp4">
        </video>
        <h3 style="color: #d4af37; font-size: 1.2rem; margin: 0 0 5px 0;">Trámites de Visas</h3>
        <p style="color: #cccccc; font-size: 0.9rem; margin: 0; line-height: 1.4;">Gestión y asesoría especializada.</p>
      </div>

    </div>

    <!-- Botón para regresar de pestaña si el usuario quiere -->
    <div style="margin-top: 5px; border-top: 1px solid rgba(212, 175, 55, 0.2); padding-top: 30px;">
      <a href="index.html" style="color: #000000; background-color: #d4af37; text-decoration: none; font-weight: bold; font-size: 0.95rem; padding: 12px 30px; border-radius: 6px; display: inline-block;">
        Volver a la Página Principal
      </a>
    </div>

  </div>

</body>
</html>
